<!DOCTYPE html>
<!--
  MPHQ Voice Recorder (hosted page)
  Version: 2.0 - November 2026
  Goes with Mission Possible HQ Index.html v1.79 and later.

  WHY THIS PAGE EXISTS: pages inside Apps Script run in a Google frame that blocks the microphone, so MPHQ
  cannot record by itself. This page is hosted OUTSIDE Apps Script (GitHub Pages), where the browser asks for
  the microphone normally. MPHQ opens it in a small window from the mic button. It starts recording straight away;
  the check button sends the recording to MPHQ (which saves and transcribes it) and the X throws it away. Either
  way this window closes and the person is back where they were in MPHQ.
  The audio only goes to the window that opened this page (postMessage). Nothing is uploaded from here.

  HOSTING: put this file at the same address as VN_RECORDER_URL in Index.html
  (default https://mpoperations.github.io/MPHQ_Data/recorder.html).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPHQ Voice Note</title>
<style>
:root { --bg:#f6f3ec; --card:#ffffff; --text:#1a1714; --text2:#5a524a; --accent:#2a5c3f; --red:#b03a3a; --border:#e0d8cc; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#14171a; --card:#1c2024; --text:#e8e6e3; --text2:#b6bac2; --accent:#3f8a5f; --red:#e06a6a; --border:#343a40; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { display: flex; align-items: center; justify-content: center; padding: 16px; }
.card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 28px 18px 24px; text-align: center; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--red); display: inline-block; margin-right: 8px; vertical-align: middle; animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
.timer { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 44px; font-weight: 600; letter-spacing: .02em; }
.limit { font-size: 12px; color: var(--text2); margin-top: 2px; }
.row { display: flex; gap: 28px; justify-content: center; margin-top: 26px; }
.round { width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--border); background: var(--card); color: var(--text2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; -webkit-tap-highlight-color: transparent; }
.round svg { width: 32px; height: 32px; }
.round.go { background: var(--accent); border-color: var(--accent); color: #fff; }
.round:disabled { opacity: .5; cursor: default; }
.round:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.msg { font-size: 14px; line-height: 1.45; color: var(--text2); margin-top: 16px; }
.msg.err { color: var(--red); }
.spin { width: 38px; height: 38px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; margin: 6px auto 0; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<div class="card" id="app" aria-live="polite"></div>
<script>
(function () {
  var MAX_SECONDS = 600;
  var X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var UP_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>';
  var MIC_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>';
  var app = document.getElementById('app');
  // state: starting | recording | sending | error | done
  var S = { state: 'starting', stream: null, rec: null, chunks: [], mime: '', seconds: 0, started: 0, timer: null, msg: '', sendAfter: false, ackTimer: null, cancelled: false };

  function hasOpener() { try { return !!(window.opener && !window.opener.closed); } catch (e) { return false; } }
  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pickMime() {
    if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return '';
    var c = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/ogg'];
    for (var i = 0; i < c.length; i++) { if (MediaRecorder.isTypeSupported(c[i])) return c[i]; }
    return '';
  }
  function stopStream() {
    if (S.timer) { clearInterval(S.timer); S.timer = null; }
    if (S.stream) { try { S.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} S.stream = null; }
  }
  function closeMe(fallbackMsg) {
    try { window.close(); } catch (e) {}
    setTimeout(function () { S.state = 'done'; S.msg = fallbackMsg; render(); }, 600);
  }

  function render() {
    var h = '';
    if (S.state === 'starting') {
      h = '<div class="msg" style="margin-top:0;">Starting the microphone&hellip;<br>If your browser asks, choose <strong>Allow</strong>.</div>';
    } else if (S.state === 'recording') {
      h = '<div><span class="dot"></span><span class="timer" id="timer">' + fmt(S.seconds) + '</span></div>' +
          '<div class="limit">up to ' + fmt(MAX_SECONDS) + '</div>' +
          '<div class="row"><button class="round" id="cancel" type="button" aria-label="Cancel and discard" title="Cancel">' + X_ICON + '</button>' +
          '<button class="round go" id="send" type="button" aria-label="Send to MPHQ" title="Send to MPHQ">' + UP_ICON + '</button></div>';
    } else if (S.state === 'sending') {
      h = '<div class="spin" aria-label="Sending"></div>';
    } else if (S.state === 'error') {
      h = '<div class="msg err" style="margin-top:0;">' + esc(S.msg) + '</div>' +
          '<div class="row"><button class="round" id="cancel" type="button" aria-label="Close" title="Close">' + X_ICON + '</button>' +
          '<button class="round go" id="retry" type="button" aria-label="Try again" title="Try again">' + MIC_ICON + '</button></div>';
    } else if (S.state === 'done') {
      h = '<div class="msg" style="margin-top:0;">' + esc(S.msg) + '</div>';
    }
    app.innerHTML = h;
    var b;
    if ((b = document.getElementById('cancel'))) b.onclick = cancel;
    if ((b = document.getElementById('send'))) b.onclick = sendNow;
    if ((b = document.getElementById('retry'))) b.onclick = start;
  }
  function fail(msg) { stopStream(); S.state = 'error'; S.msg = msg; render(); }

  function start() {
    S.cancelled = false; S.sendAfter = false; S.chunks = []; S.seconds = 0; S.state = 'starting'; render();
    if (!hasOpener()) { fail('Open this recorder from the mic button in Mission Possible HQ, so the note can be sent back there.'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
      fail('This browser cannot record audio. Try the latest Chrome or Safari.'); return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      if (S.cancelled) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      S.stream = stream;
      var mime = pickMime(), rec;
      try { rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
      catch (e) { fail('Recording could not start on this device.'); return; }
      S.rec = rec; S.mime = rec.mimeType || mime || 'audio/webm';
      rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) S.chunks.push(ev.data); };
      rec.onstop = onStopped;
      rec.onerror = function () { fail('The recording stopped unexpectedly. Please try again.'); };
      rec.start(1000);
      S.state = 'recording'; S.started = Date.now(); S.seconds = 0;
      S.timer = setInterval(tick, 250);
      render();
    }).catch(function (e) {
      var n = e && e.name;
      fail(n === 'NotAllowedError' || n === 'SecurityError'
        ? 'The microphone is blocked for this page. Click the lock or microphone icon in the address bar, set Microphone to Allow, then try again.'
        : (n === 'NotFoundError' ? 'No microphone was found on this device.' : 'The microphone could not be started.'));
    });
  }
  function tick() {
    S.seconds = Math.floor((Date.now() - S.started) / 1000);
    var t = document.getElementById('timer'); if (t) t.textContent = fmt(S.seconds);
    if (S.seconds >= MAX_SECONDS) sendNow();
  }
  // The check button: stop, then send as soon as the recorder has handed over its last piece.
  function sendNow() {
    if (S.state !== 'recording' || !S.rec) return;
    S.sendAfter = true; S.state = 'sending'; render();
    try { S.rec.stop(); } catch (e) { fail('The recording could not be finished. Please try again.'); }
  }
  function onStopped() {
    var secs = S.started ? Math.max(1, Math.round((Date.now() - S.started) / 1000)) : S.seconds;
    stopStream();
    if (S.cancelled || !S.sendAfter) return;
    var blob = new Blob(S.chunks, { type: S.mime }); S.chunks = [];
    if (!blob.size || blob.size < 800) { fail('Nothing was recorded. Check your microphone and try again.'); return; }
    S.seconds = Math.min(MAX_SECONDS, secs);
    post(blob);
  }
  function post(blob) {
    if (!hasOpener()) { fail('MPHQ is not open any more. Open this recorder again from the mic button in MPHQ.'); return; }
    try {
      window.opener.postMessage({ type: 'mphq-voice-note', version: 2, mime: blob.type || S.mime, seconds: S.seconds, blob: blob }, '*');
    } catch (e) { fail('The note could not be sent: ' + (e && e.message ? e.message : e)); return; }
    S.ackTimer = setTimeout(function () {
      if (S.state !== 'sending') return;
      fail('MPHQ did not answer. Switch to the MPHQ window and try again.');
    }, 20000);
  }
  function cancel() {
    S.cancelled = true; S.sendAfter = false;
    if (S.rec && S.rec.state !== 'inactive') { S.rec.onstop = null; try { S.rec.stop(); } catch (e) {} }
    stopStream();
    if (S.ackTimer) { clearTimeout(S.ackTimer); S.ackTimer = null; }
    closeMe('Cancelled. You can close this window.');
  }
  // Only the window that opened this page may answer.
  window.addEventListener('message', function (e) {
    if (!window.opener || e.source !== window.opener) return;
    var d = e.data; if (!d || d.type !== 'mphq-voice-ack') return;
    if (S.ackTimer) { clearTimeout(S.ackTimer); S.ackTimer = null; }
    if (S.state !== 'sending') return;
    if (d.ok) closeMe('Sent. You can close this window.');
    else fail(d.error || 'MPHQ could not take that recording.');
  });
  window.addEventListener('beforeunload', stopStream);
  start();
})();
</script>
</body>
</html>
